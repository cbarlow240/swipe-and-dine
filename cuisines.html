<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#171717">

  <title>Choose Your Food | Swipe & Dine</title>

 <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <main class="app cuisine-page">

    <header class="cuisine-header">

      <button
        class="back-button"
        id="backButton"
        aria-label="Go back">
        ←
      </button>

      <div class="small-brand">
        Swipe <span>&</span> Dine
      </div>

      <div class="header-spacer"></div>

    </header>


    <section class="cuisine-intro">

      <div class="step-label">STEP 2</div>

      <h1>What do you fancy?</h1>

      <p>
        Pick as many as you like.
        We'll mix things up for you.
      </p>

    </section>


    <section class="cuisine-grid">

     <button class="cuisine-option cuisine-with-image" data-cuisine="Italian">

  <img
    src="images/pizza.png"
    alt="Italian pizza"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇮🇹</span>
    <span class="cuisine-name">Italian</span>
  </div>

  <span class="selected-check">✓</span>

</button>

     <button class="cuisine-option cuisine-with-image" data-cuisine="Mexican">

  <img
    src="images/mexican.png"
    alt="Mexican tacos"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇲🇽</span>
    <span class="cuisine-name">Mexican</span>
  </div>

  <span class="selected-check">✓</span>

</button>

      <button class="cuisine-option cuisine-with-image" data-cuisine="Indian">

  <img
    src="images/indian.png"
    alt="Indian curry"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇮🇳</span>
    <span class="cuisine-name">Indian</span>
  </div>

  <span class="selected-check">✓</span>

</button>

     <button class="cuisine-option cuisine-with-image" data-cuisine="Chinese">

  <img
    src="images/chinese.png"
    alt="Chinese noodles"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇨🇳</span>
    <span class="cuisine-name">Chinese</span>
  </div>

  <span class="selected-check">✓</span>

</button>

     <button class="cuisine-option cuisine-with-image" data-cuisine="British">

  <img
    src="images/british.png"
    alt="British fish and chips"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇬🇧</span>
    <span class="cuisine-name">British</span>
  </div>

  <span class="selected-check">✓</span>

</button>

     <button class="cuisine-option cuisine-with-image" data-cuisine="Spanish">

  <img
    src="images/spanish.png"
    alt="Spanish seafood paella"
    class="cuisine-image"
  >

  <div class="cuisine-label">
    <span class="cuisine-flag">🇪🇸</span>
    <span class="cuisine-name">Spanish</span>
  </div>

  <span class="selected-check">✓</span>

</button>

      <button class="cuisine-option" data-cuisine="American">
        <span class="cuisine-emoji">🇺🇸</span>
        <span class="cuisine-name">American</span>
      </button>

      <button class="cuisine-option" data-cuisine="Mediterranean">
        <span class="cuisine-emoji">☀️</span>
        <span class="cuisine-name">Mediterranean</span>
      </button>

      <button class="cuisine-option" data-cuisine="Healthy">
        <span class="cuisine-emoji">🥗</span>
        <span class="cuisine-name">Healthy</span>
      </button>

      <button class="cuisine-option" data-cuisine="Comfort Food">
        <span class="cuisine-emoji">🍲</span>
        <span class="cuisine-name">Comfort Food</span>
      </button>

      <button class="cuisine-option surprise-option" data-cuisine="Surprise Me">
        <span class="cuisine-emoji">🎲</span>

        <span class="cuisine-name">
          Surprise Me
        </span>

        <span class="surprise-text">
          Anything goes
        </span>
      </button>

    </section>


    <section class="cuisine-bottom">

      <p id="selectionCount">
        Choose at least one
      </p>

      <button
        id="startSwipingButton"
        class="continue-button"
        disabled>

        START SWIPING

        <span>→</span>

      </button>

    </section>

  </main>


  <script src="cuisines.js"></script>

</body>
</html>
